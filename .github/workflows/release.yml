name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: bash
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Run tests
        run: bash scripts/test.sh
      - name: Package universal app
        run: bash scripts/package-release.sh
      - name: Verify architectures and checksum
        shell: bash
        run: |
          architectures="$(lipo -archs dist/ScreenMate.app/Contents/MacOS/ScreenMate)"
          [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
          cd dist
          shasum -a 256 -c ./*.sha256
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --verify-tag \
            --title "ScreenMate ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
